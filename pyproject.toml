[project]
name = "ai-invoice-auditor"
version = "0.1.0"
description = "AI Agentic Invoice Auditor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.0.10",
    "fastmcp>=0.1.0",
    "qdrant-client>=1.7.0",
    "langfuse>=2.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
    "litellm>=1.0.0",
    "fpdf>=1.7.2",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "langchain-text-splitters>=0.0.1",
    "langchain-core>=0.1.0",
    "streamlit>=1.30.0",
    "pymupdf>=1.23.0",
    "instructor>=1.0.0",
    "langdetect>=1.0.9",
    "ragas>=0.1.0",
    "langchain-community>=0.0.10",
    "langchain-litellm>=0.3.2",
    "mlflow>=2.8.0",
    "pandas>=2.0.0",
    "google-generativeai>=0.3.0",
    "pytesseract>=0.3.13",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "langchain-aws>=1.1.0",
    "google-adk>=1.21.0",
    "a2a-sdk>=0.3.21",
    "presidio-analyzer>=2.2.360",
    "presidio-anonymizer>=2.2.360",
    "fpdf2>=2.8.5",
    "fastapi>=0.123.10",
    "uvicorn>=0.38.0",
    "pydantic>=2.12.5",
    "requests>=2.32.5",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
