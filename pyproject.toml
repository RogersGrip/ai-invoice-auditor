[project]
name = "ai-invoice-auditor"
version = "0.1.0"
description = "AI Agentic Invoice Auditor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.0.10",
    "fastmcp>=0.1.0",
    "qdrant-client>=1.7.0",
    "langfuse>=2.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
    "litellm>=1.0.0",
    "fpdf>=1.7.2",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "langchain-text-splitters>=0.0.1",
    "langchain-core>=0.1.0",
    "streamlit>=1.30.0",
    "pymupdf>=1.23.0",
    "instructor>=1.0.0",
    "langdetect>=1.0.9",
    "ragas>=0.1.0",
    "langchain-community>=0.0.10",
    "langchain-litellm>=0.3.2",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
